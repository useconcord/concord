name: Links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "lychee.toml"
      - ".github/workflows/links.yml"
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-links:
    name: Check relative links and anchors
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --offline
            --include-fragments
            --no-progress
            --format detailed
            "**/*.md"
          fail: true
          output: /tmp/lychee-offline.md

  weekly-external-links:
    name: Weekly external link audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links (full)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --include-fragments
            --no-progress
            --format detailed
            "**/*.md"
          fail: false
          output: /tmp/lychee-full.md

      - name: Open issue on failure
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Dead links detected (weekly link check)"
          content-filepath: /tmp/lychee-full.md
          labels: documentation, broken-links

      - name: Fail job if links are broken
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
