name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check-name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fixed minor: detect regressions in the minimum tested Node 24 line.
          - os: ubuntu-latest
            node: '24.10'
            check-name: 'Ubuntu / Node 24.10.x'
          # Floating major: catch upcoming Node 24 patch/minor changes.
          - os: ubuntu-latest
            node: '24.x'
            check-name: 'Ubuntu / Node 24.x'
          # node:sqlite can differ across platforms, especially filesystem paths.
          - os: macos-latest
            node: '24.x'
            check-name: 'macOS / Node 24.x'
    steps:
      - uses: actions/checkout@v4
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API and the dashboard import packages/core from its build output, so build first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
