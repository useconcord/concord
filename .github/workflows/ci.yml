name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API and the dashboard import packages/core from its build output, so build first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Core coverage
        run: pnpm --filter @concord/core test:coverage
      - name: API coverage
        run: pnpm --filter @concord/api test:coverage
      - name: Upload lcov reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            packages/core/coverage/lcov.info
            services/api/coverage/lcov.info
          if-no-files-found: error
