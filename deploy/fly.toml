# Replace the app, region and public URL for your own deployment before using.
# Run with: fly deploy --config deploy/fly.toml --ha=false --app <your-app>
# One always-on machine only: the SQLite volume and in-process indexer cannot
# safely be shared by multiple Fly machines.
app = "concord-prod"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CONCORD_HOST = "0.0.0.0"
  CONCORD_PORT = "4400"
  CONCORD_DATA_DIR = "/data"
  CONCORD_PUBLIC_URL = "https://concord-prod.fly.dev"
  CONCORD_TRUST_PROXY = "1"
  CONCORD_SIGNUP = "code"

[[mounts]]
  source = "concord_data"
  destination = "/data"
  initial_size = "10gb"

[http_service]
  internal_port = 4400
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
